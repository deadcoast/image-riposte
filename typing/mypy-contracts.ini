[mypy]
python_version = 3.13
mypy_path = $MYPY_CONFIG_FILE_DIR/stubs
files = typing/stubs, typing/checks
strict = True
show_error_codes = True
show_column_numbers = True
pretty = False
cache_dir = typing/.cache/mypy-contracts

# External declarations and static consumers only. Run from the repository root.
# The default root mypy.ini checks the application implementation separately.
