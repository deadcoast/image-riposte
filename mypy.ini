[mypy]
python_version = 3.13
mypy_path = $MYPY_CONFIG_FILE_DIR/typing/stubs
files = typing/stubs, typing/checks
strict = True
show_error_codes = True
show_column_numbers = True
pretty = False
cache_dir = typing/.cache/mypy

# This checks the external interface and its consumers. The independent source
# audit deliberately does not use this stub path: typing/mypy-source.ini.
