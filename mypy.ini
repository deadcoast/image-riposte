[mypy]
python_version = 3.13
files = src/riposte
strict = True
show_error_codes = True
show_column_numbers = True
pretty = False
cache_dir = typing/.cache/mypy-source
incremental = False
follow_imports = normal
exclude = ^(?:\./)?(?:build|dist|history|packages|patches|tests|scripts|typing|archive)(?:/|$)

# Default checks cover application implementation. Recursive discovery excludes
# distribution/history copies and separate test/tooling trees, never src/riposte.
# Check external contracts with --config-file typing/mypy-contracts.ini.
