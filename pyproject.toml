[build-system]
requires = ["setuptools>=78", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "riposte-studio"
version = "0.4.0"
description = "Local-first artwork sanitation, organization, and image-integrated protection for publication"
requires-python = ">=3.11"
license = "MIT"
readme = "README.md"
dependencies = ["Pillow>=12.3,<13", "numpy>=2.2,<3", "fastapi>=0.128,<1", "uvicorn>=0.35,<1", "typer>=0.20,<0.27", "rich>=14,<16"]

[project.optional-dependencies]
lab = ["torch>=2.10,<3", "diffusers>=0.35,<1", "transformers>=4.56,<6", "safetensors>=0.6,<1", "accelerate>=1.10,<2"]
test = ["pytest>=8.4,<10", "httpx>=0.28,<1"]

[project.scripts]
riposte = "riposte.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
riposte = ["static/*", "methods.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
